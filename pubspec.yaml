name: gate_buddy
description: "Gate Buddy"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

# ----------------------------------------------------------------
# DEPENDENCIES
# ----------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^2.0.7

  # Networking
  dio: ^5.9.0

  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # Localization
  easy_localization: ^3.0.8

  # UI
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.9.1
  google_fonts: ^6.2.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.4

  # Maps & Media
  google_maps_flutter: ^2.13.1
  image_picker: ^1.2.0

  # Utilities
  url_launcher: ^6.3.2
  internet_connection_checker: ^1.0.0+1
  get_it: ^7.7.0
  persistent_bottom_nav_bar: ^6.2.1

# ----------------------------------------------------------------
# DEV DEPENDENCIES
# ----------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  test: ^1.25.2
  mockito: ^5.4.4
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4
  rename: ^3.0.2

# ----------------------------------------------------------------
# FLUTTER CONFIG
# ----------------------------------------------------------------
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/lang/
    - assets/svgs/

# ----------------------------------------------------------------
# APP ICON CONFIG
# ----------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/90.png"
  min_sdk_android: 21