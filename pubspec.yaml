name: koleya
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  font_awesome_flutter: ^10.9.1
  google_maps_flutter: ^2.13.1
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/Splash.png
    - assets/images/3.png
    - assets/images/2.png
    - assets/images/1.png
    - assets/images/5.png
    - assets/images/6.png
    - assets/images/90.png   # 👈 أضفنا الأيقونة هنا
    - assets/images/egypt_air_logo.png

# 👇 ده بلوك الإعدادات اللي كان ناقص
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/90.png"
  min_sdk_android: 21
